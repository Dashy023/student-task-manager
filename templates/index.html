<!DOCTYPE html>
<html>
<head>
    <title>Taskora – Add Task</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style_v2.css') }}?v=ADD">
</head>
<body>

<!-- TOP NAV -->
<div class="dashboard-container">
    <div style="max-width:1100px; margin:auto; display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">📘 Taskora</h2>
        <div style="display:flex; gap:20px;">
            <a href="/">Add Task</a>
            <a href="/tasks">Tasks</a>
            <a href="/progress">Progress</a>
        </div>
    </div>
</div>

<!-- CENTERED ADD TASK -->
<div class="container" style="max-width:500px; margin-top:40px;">

    <h1 style="text-align:center; margin-bottom:20px;">➕ Add New Task</h1>

    <form method="POST" class="add-form" style="grid-template-columns:1fr;">

        <input name="title" placeholder="Task title" required>
        <input name="subject" placeholder="Subject" required>
        <input type="date" name="due_date" required>

        <select name="priority">
            <option>High</option>
            <option selected>Medium</option>
            <option>Low</option>
        </select>

        <button>Add Task</button>
    </form>

</div>

</body>
</html>
